# ============================================================================
#  SERRA SMART — package Home Assistant
# ============================================================================
#
#  COME INSTALLARLO
#  ----------------
#  1. In configuration.yaml aggiungi (una sola volta):
#
#         homeassistant:
#           packages: !include_dir_named packages
#
#  2. Copia questo file in  <config>/packages/serra.yaml
#  3. Ricarica: Strumenti per sviluppatori -> YAML -> "Ricarica tutto"
#
#  COSA CONTIENE
#  -------------
#  I sensori e i comandi principali NON sono qui: arrivano da soli via MQTT
#  Discovery dal ponte. Qui c'e' solo quello che la discovery non puo' fare:
#  contatori derivati, sensori calcolati e automazioni di allarme.
#
#  COME NASCONO GLI ENTITY ID
#  --------------------------
#  Home Assistant li ricava dal campo "name", NON da "unique_id": lo slug si
#  ottiene mettendo tutto in minuscolo e sostituendo con underscore tutto
#  cio' che non e' lettera o cifra — apostrofi compresi. Verificato sul campo:
#  "Serra minuti dall'ultimo contatto" diventa
#  sensor.serra_minuti_dall_ultimo_contatto, con l'apostrofo trasformato in
#  underscore e non semplicemente tolto. Se aggiungi entita' tue, ricordatelo
#  o i riferimenti non troveranno nulla e i sensori resteranno "non
#  disponibile" senza spiegazione.
#
#  Una volta registrata, pero', l'entita' conserva il suo id anche se il nome
#  cambia: il registro la ritrova dall'unique_id. Per questo due nomi qui
#  sotto sono quelli della prima installazione ("Serra ora del nodo", "Serra
#  minuti dall'ultimo contatto") e non vanno "ripuliti": con i nomi senza
#  apostrofo che il repository ha usato fra settembre e novembre 2026 il
#  file diventava incompatibile con l'installazione vera, e l'allarme "nodo
#  muto" non sarebbe scattato mai.
#
#  utility_meter e' un caso a se': l'entity_id viene dal "name", ma
#  l'unique_id dalla CHIAVE. Cambiare la chiave di un contatore gia' esistente
#  crea un'entita' nuova che, trovando l'id occupato, finisce con "_2" in coda
#  e perde tutto lo storico. Le chiavi qui sotto non vanno rinominate.
#
#  ATTENZIONE AGLI ENTITY ID
#  -------------------------
#  Home Assistant li genera da "nome dispositivo + nome entita'", quindi
#  dovrebbero corrispondere a quelli usati qui. Verificali comunque in
#  Strumenti per sviluppatori -> Stati filtrando per "serra", e correggili
#  se il tuo Home Assistant li ha numerati diversamente (_2 in coda e simili).
# ============================================================================

# ---------------------------------------------------------------------------
#  Contatori dell'acqua
# ---------------------------------------------------------------------------
#  Il nodo trasmette solo il totale cumulativo (acquaTot): i totali giornaliero
#  e mensile li calcola Home Assistant, che lo fa molto meglio e senza occupare
#  byte preziosi nel pacchetto LoRa.
#
#  periodically_resetting: false, perche' acquaTot non si azzera mai da solo.
#  Senza, il contatore trattava ogni ritorno da "non disponibile" (una
#  riconnessione del ponte) come un azzeramento della sorgente e ripartiva
#  dal valore nuovo, buttando l'acqua erogata nel frattempo: a ottobre 2026
#  il mensile segnava 68,20 L contro 79,44 L veri.

utility_meter:
  acqua_serra_giornaliera:
    name: Acqua serra oggi
    source: sensor.serra_acqua_totale
    cycle: daily
    periodically_resetting: false

  acqua_serra_mensile:
    name: Acqua serra questo mese
    source: sensor.serra_acqua_totale
    cycle: monthly
    periodically_resetting: false

# ---------------------------------------------------------------------------
#  Il pulsante "Durata automatica" e la durata normale
# ---------------------------------------------------------------------------
#  Acceso: la durata dell'irrigazione la decide Home Assistant ogni mattina,
#  da notte e previsione ("Serra durata irrigazione consigliata"; vedi le
#  automazioni "Serra - Durata automatica ..." in fondo).
#  Spento: sul nodo torna la DURATA NORMALE, quella impostata a mano.
#
#  Non e' "Irrigazione automatica" (switch.serra_irrigazione_automatica), che
#  accende e spegne l'irrigazione programmata: quella decide SE irrigare, questo
#  decide QUANTO.
#
#  Le chiavi sono quelle della prima versione (11/11/2026, "irrigazione
#  adattiva" e "durata base"): per gli input_* l'entity_id viene dalla
#  chiave, e cambiarla creerebbe entita' nuove perdendo lo stato.

input_boolean:
  serra_irrigazione_adattiva:
    name: Serra durata automatica
    icon: mdi:robot-happy-outline

input_number:
  # La durata impostata a mano. Si aggiorna da sola ogni volta che qualcuno
  # cambia la durata sul nodo (da dashboard o dal dettaglio dell'entita'),
  # e torna sul nodo quando si spegne la durata automatica. Niente
  # "initial": Home Assistant la ricorda fra un riavvio e l'altro; al primo
  # avvio, finche' e' al minimo, la si prende dal nodo.
  serra_durata_base_irrigazione:
    name: Serra durata normale irrigazione
    min: 10
    max: 600
    step: 10
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-cog-outline

# ---------------------------------------------------------------------------
#  Medie mobili per la notte e per la previsione barometrica
# ---------------------------------------------------------------------------
#  Alle 6:00 le medie su 8 ore coprono esattamente la notte, dalle 22 alle 6:
#  il sensore "Serra notte temperatura" le fotografa in quel momento.
#  average_linear e' la media pesata sul tempo: il recorder salva una riga
#  solo quando il valore cambia, e una media dei soli campioni darebbe troppo
#  peso ai momenti in cui la temperatura si muove.

sensor:
  - platform: statistics
    name: "Serra temperatura media 8 ore"
    unique_id: serra_temperatura_media_8h
    entity_id: sensor.serra_temperatura
    state_characteristic: average_linear
    max_age:
      hours: 8
    sampling_size: 200
    precision: 2

  - platform: statistics
    name: "Serra umidita media 8 ore"
    unique_id: serra_umidita_media_8h
    entity_id: sensor.serra_umidita_aria
    state_characteristic: average_linear
    max_age:
      hours: 8
    sampling_size: 200
    precision: 1

  - platform: statistics
    name: "Serra temperatura minima 8 ore"
    unique_id: serra_temperatura_minima_8h
    entity_id: sensor.serra_temperatura
    state_characteristic: value_min
    max_age:
      hours: 8
    sampling_size: 200
    precision: 2

  # Quanto e' cambiata la pressione nelle ultime 3 ore: la tendenza
  # barometrica che usa la previsione Zambretti.
  - platform: statistics
    name: "Serra pressione variazione 3 ore"
    unique_id: serra_pressione_variazione_3h
    entity_id: sensor.serra_pressione
    state_characteristic: change
    max_age:
      hours: 3
    sampling_size: 100
    precision: 1

# ---------------------------------------------------------------------------
#  Sensori MQTT aggiuntivi (quelli che la discovery non genera)
# ---------------------------------------------------------------------------

mqtt:
  sensor:
    # Momento esatto in cui il ponte ha ricevuto l'ultimo pacchetto.
    # Piu' affidabile di last_changed: quello si aggiorna solo quando il valore
    # cambia, quindi con una temperatura stabile sembrerebbe che il nodo sia
    # muto da ore.
    - name: "Serra ultimo contatto"
      unique_id: serra_ultimo_contatto
      state_topic: "serra/nodo/stato"
      value_template: >-
        {{ (value_json.ts_ponte | int(0)) | timestamp_utc }}
      device_class: timestamp
      availability_topic: "serra/ponte/stato"
      icon: mdi:clock-check-outline

    # Ora dichiarata dal NODO: se resta a 1970 vuol dire che il DS1307 ha perso
    # l'ora e non e' ancora stato risincronizzato dal ponte.
    - name: "Serra ora del nodo"
      unique_id: serra_ora_nodo
      state_topic: "serra/nodo/stato"
      value_template: >-
        {% set t = value_json.t | int(0) %}
        {{ '' if t == 0 else (t | timestamp_utc) }}
      device_class: timestamp
      availability_topic: "serra/ponte/stato"
      entity_category: diagnostic
      icon: mdi:clock-alert-outline

  binary_sensor:
    # La radio LoRa del ponte sta ascoltando?
    #
    # L'11/11/2026 il ponte era acceso, collegato e "online", ma il suo modulo
    # LoRa non usciva da sleep: dalla serra non arrivava piu' niente, e in Home
    # Assistant l'unico segno era il nodo che dopo due ore risultava muto. Qui
    # il guasto ha un nome suo. "Problema" quando:
    #   - radio_ok vale 0: il modulo non risponde o non entra in ricezione, e
    #     il ponte (dalla 2.6.1) riprova ad avviarlo ogni 30 secondi;
    #   - radio_avv non e' vuoto: a reset appena fatto un registro non tornava.
    # Il motivo, in parole, e' nell'attributo "motivo". L'attributo
    # "in_ascolto" dice se intanto la radio riceve: no se radio_ok e' 0, e no
    # anche se il registro che non torna e' il modo (0x01) o la versione
    # (0x42), che e' come il ponte 2.6.0 presentava la radio in sleep
    # tenendo radio_ok a 1.
    - name: "Serra radio del ponte"
      unique_id: serra_radio_del_ponte
      state_topic: "serra/ponte/diag"
      value_template: >-
        {{ 'ON' if (value_json.radio_ok | default(1) | int(1)) == 0
                   or (value_json.radio_avv | default('')) != ''
           else 'OFF' }}
      json_attributes_topic: "serra/ponte/diag"
      json_attributes_template: >-
        {% set motivo = value_json.radio_avv | default('') %}
        {{ {'motivo': motivo,
            'in_ascolto': (value_json.radio_ok | default(1) | int(1)) == 1
                          and not (motivo.startswith('reg 0x01') or motivo.startswith('reg 0x42')),
            'avvii_falliti': value_json.radio_falliti | default(0),
            'riparazioni': value_json.radio_rip | default(0),
            'ultima_riparazione': value_json.radio_det | default('')} | tojson }}
      device_class: problem
      availability_topic: "serra/ponte/stato"
      entity_category: diagnostic
      icon: mdi:radio-tower

# ---------------------------------------------------------------------------
#  Sensori calcolati
# ---------------------------------------------------------------------------

template:
  - sensor:
      # --- VPD: deficit di pressione di vapore --------------------------------
      # E' il parametro agronomico che conta davvero in serra, molto piu' della
      # sola umidita' relativa: dice quanta "sete d'aria" hanno le piante.
      # Indicativamente: < 0,4 kPa troppo umido (rischio funghi),
      # 0,8-1,2 kPa ideale in vegetazione, > 1,6 kPa stress idrico.
      - name: "Serra VPD"
        unique_id: serra_vpd
        unit_of_measurement: "kPa"
        state_class: measurement
        icon: mdi:water-thermometer
        availability: >-
          {{ states('sensor.serra_temperatura') not in ['unknown','unavailable','']
             and states('sensor.serra_umidita_aria') not in ['unknown','unavailable',''] }}
        state: >-
          {% set t  = states('sensor.serra_temperatura')  | float(0) %}
          {% set rh = states('sensor.serra_umidita_aria') | float(0) %}
          {% set es = 0.6108 * e ** (17.27 * t / (t + 237.3)) %}
          {{ (es * (1 - rh / 100)) | round(2) }}

      # --- Minuti dall'ultimo contatto ---------------------------------------
      - name: "Serra minuti dall'ultimo contatto"
        unique_id: serra_minuti_silenzio
        unit_of_measurement: "min"
        state_class: measurement
        icon: mdi:timer-sand
        state: >-
          {% set t = states('sensor.serra_ultimo_contatto') %}
          {% if t in ['unknown','unavailable',''] %}
            {{ 9999 }}
          {% else %}
            {{ ((now() - (t | as_datetime)).total_seconds() / 60) | round(0) }}
          {% endif %}

      # --- Stato sintetico, per la testata della dashboard --------------------
      - name: "Serra stato generale"
        unique_id: serra_stato_generale
        icon: mdi:greenhouse
        state: >-
          {% set silenzio = states('sensor.serra_minuti_dall_ultimo_contatto') | int(9999) %}
          {% set batt     = states('sensor.serra_tensione_batteria') | float(99) %}
          {% set coda     = states('sensor.serra_comandi_in_coda') | int(0) %}
          {% set backlog  = states('sensor.serra_record_in_backlog') | int(0) %}
          {% set copertura = states('sensor.serra_cicli_ricevuti_24h') | float(100) %}
          {% if states('binary_sensor.serra_ponte_online') == 'off' %} Ponte offline
          {% elif silenzio > 120 %} Nodo non risponde
          {% elif batt < 11.0 %} Batteria scarica
          {% elif copertura < 80 %} Collegamento debole
          {% elif backlog < 0 %} MicroSD guasta
          {% elif backlog > 10 %} Dati in attesa
          {% elif coda > 0 %} Comando in coda
          {% else %} Tutto ok
          {% endif %}
        attributes:
          minuti_silenzio: "{{ states('sensor.serra_minuti_dall_ultimo_contatto') | int(9999) }}"
          comandi_in_coda: "{{ states('sensor.serra_comandi_in_coda') | int(0) }}"
          cicli_ricevuti_24h: "{{ states('sensor.serra_cicli_ricevuti_24h') }}"

  - binary_sensor:
      - name: "Serra ponte online"
        unique_id: serra_ponte_online
        device_class: connectivity
        state: "{{ states('sensor.serra_ponte_uptime') not in ['unknown','unavailable'] }}"

      # --- Anomalia idraulica: valvola aperta ma nessuna acqua ---------------
      # E' l'allarme piu' utile che il flussometro rende possibile: pompa
      # guasta, serbatoio vuoto, filtro otturato o tubo staccato.
      - name: "Serra anomalia irrigazione"
        unique_id: serra_anomalia_irrigazione
        device_class: problem
        icon: mdi:water-alert
        state: "{{ states('sensor.serra_esito_irrigazione') == 'nessun_flusso' }}"

  # --- Temperatura massima e minima di oggi ----------------------------------
  # Sensori "a trigger": si aggiornano a ogni nuova lettura e a mezzanotte.
  # L'attributo "giorno" fa ripartire il conteggio quando cambia la data (anche
  # se HA era spento a mezzanotte); "ora" dice quando e' stato toccato l'estremo;
  # "ieri" conserva l'estremo del giorno prima, che usa l'irrigazione adattiva.
  # Dopo un riavvio HA ripristina da solo valore e attributi.
  - triggers:
      - trigger: time
        at: "00:00:00"
      - trigger: state
        entity_id: sensor.serra_temperatura
        not_to: [unknown, unavailable]
    sensor:
      - name: "Serra temperatura massima oggi"
        unique_id: serra_temperatura_max_oggi
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-chevron-up
        state: >-
          {% set t = states('sensor.serra_temperatura') | float(none) %}
          {% set m = this.state | float(none) if this.attributes.get('giorno') == now().date() | string else none %}
          {% set v = [t, m] | reject('none') | list %}
          {{ (v | max) if v else none }}
        attributes:
          giorno: "{{ now().date() | string }}"
          ora: >-
            {% set t = states('sensor.serra_temperatura') | float(none) %}
            {% set m = this.state | float(none) if this.attributes.get('giorno') == now().date() | string else none %}
            {{ now().strftime('%H:%M') if t is not none and (m is none or t > m)
               else (this.attributes.get('ora') if m is not none else none) }}
          ieri: >-
            {% set g = this.attributes.get('giorno') %}
            {% if g == now().date() | string %}{{ this.attributes.get('ieri') }}
            {% elif g == (now() - timedelta(days=1)).date() | string %}{{ this.state | float(none) }}
            {% else %}{{ none }}{% endif %}

      - name: "Serra temperatura minima oggi"
        unique_id: serra_temperatura_min_oggi
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-chevron-down
        state: >-
          {% set t = states('sensor.serra_temperatura') | float(none) %}
          {% set m = this.state | float(none) if this.attributes.get('giorno') == now().date() | string else none %}
          {% set v = [t, m] | reject('none') | list %}
          {{ (v | min) if v else none }}
        attributes:
          giorno: "{{ now().date() | string }}"
          ora: >-
            {% set t = states('sensor.serra_temperatura') | float(none) %}
            {% set m = this.state | float(none) if this.attributes.get('giorno') == now().date() | string else none %}
            {{ now().strftime('%H:%M') if t is not none and (m is none or t < m)
               else (this.attributes.get('ora') if m is not none else none) }}
          ieri: >-
            {% set g = this.attributes.get('giorno') %}
            {% if g == now().date() | string %}{{ this.attributes.get('ieri') }}
            {% elif g == (now() - timedelta(days=1)).date() | string %}{{ this.state | float(none) }}
            {% else %}{{ none }}{% endif %}

  # --- Cicli ricevuti nelle ultime 24 ore ------------------------------------
  # Quanti dei risvegli attesi hanno lasciato un dato in Home Assistant, in
  # tempo reale (serra/nodo/stato) o recuperato dopo dalle code del nodo
  # (serra/nodo/storico). E' la misura che mancava: dal 31/10 al 10/11/2026
  # e' arrivato l'87% dei cicli, e lo si e' scoperto solo contando a mano
  # i salti nell'ora del nodo.
  #
  # Ogni pacchetto viene ricondotto al suo "posto" nel calendario dei
  # risvegli (t diviso l'intervallo, arrotondato): l'esito di un comando
  # partito pochi secondi dopo il pacchetto principale, o la ripubblicazione
  # del retained dopo una riconnessione, cadono nello stesso posto e non
  # contano due volte. L'attributo "slot" tiene i posti delle ultime 24 ore;
  # nelle prime 24 ore di vita il confronto si fa sul tempo trascorso.
  - triggers:
      - trigger: mqtt
        topic: "serra/nodo/stato"
      - trigger: mqtt
        topic: "serra/nodo/storico"
      - trigger: time_pattern
        minutes: "/15"
    sensor:
      - name: "Serra cicli ricevuti 24h"
        unique_id: serra_cicli_ricevuti_24h
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:radar
        state: >-
          {% set slp = states('number.serra_intervallo_risveglio') | int(900) %}
          {% set slp = slp if slp >= 60 else 900 %}
          {% set t = (trigger.payload_json.t | default(0) | int(0)) if trigger.platform == 'mqtt' and trigger.payload_json is defined else 0 %}
          {% set nuovo = [(t / slp) | round(0) | int] if t > 0 else [] %}
          {% set adesso = now().timestamp() %}
          {% set slot = ((this.attributes.get('slot') or []) + nuovo)
                        | unique | select('>', ((adesso - 86400) / slp) | int) | list %}
          {% set inizio = this.attributes.get('inizio') or adesso %}
          {% set attesi = ([86400, adesso - inizio] | min / slp) | round(0) %}
          {{ ([100, slot | count / attesi * 100] | min) | round(0) if attesi >= 1 else 100 }}
        attributes:
          slot: >-
            {% set slp = states('number.serra_intervallo_risveglio') | int(900) %}
            {% set slp = slp if slp >= 60 else 900 %}
            {% set t = (trigger.payload_json.t | default(0) | int(0)) if trigger.platform == 'mqtt' and trigger.payload_json is defined else 0 %}
            {% set nuovo = [(t / slp) | round(0) | int] if t > 0 else [] %}
            {{ ((this.attributes.get('slot') or []) + nuovo)
               | unique | select('>', ((now().timestamp() - 86400) / slp) | int) | sort | list }}
          inizio: "{{ this.attributes.get('inizio') or now().timestamp() | int }}"

  # ===========================================================================
  #  NOTTE, PREVISIONE E DURATA DELL'IRRIGAZIONE
  # ===========================================================================
  #  Come e' stato tarato (novembre 2026, dati da agosto, vedi
  #  tools/calibra_irrigazione.py che rifa' tutti i conti):
  #
  #  1. Perche' la notte. Il BME280 sta in una scatola di plastica dentro la
  #     serra. Di giorno la scatola al sole fa da forno: massime di 40-50 °C
  #     anche a ottobre, e un'umidita' relativa che scende perche' l'aria
  #     dentro si scalda. Di notte, senza sole, scatola e aria sono in
  #     equilibrio: temperatura e umidita' notturne sono le misure buone. Da
  #     li' si ricava la PRESSIONE DI VAPORE, cioe' quanta acqua c'e' davvero
  #     nell'aria, che durante il giorno cambia poco.
  #
  #  2. La "domanda" del giorno (kPa·h) e' la somma ora per ora del deficit di
  #     pressione di vapore fra le 8 e le 18: quanto l'aria "tira" acqua da
  #     piante e terreno. Si ricostruisce con:
  #       - la minima della notte, da cui parte la giornata;
  #       - la massima prevista in serra, a cui arriva verso le 13;
  #       - la pressione di vapore notturna, che di giorno cresce di circa
  #         1,2 volte (evaporazione dentro la serra).
  #     La curva della temperatura e' una campana di 3 ore attorno alle 13.
  #     Con le massime vere, questo calcolo rifa' la domanda misurata con
  #     R² = 0,89 su 67 giorni.
  #
  #  3. La massima in serra si prevede da met.no: massima esterna fra le 8 e
  #     le 18 + una correzione + 19,2 °C per la frazione di sole (1 = sereno).
  #     Con il cielo coperto la serra sta pochi gradi sopra l'esterno, con il
  #     sole quasi 30. La correzione (8,3 °C al 10/11) la impara il sensore
  #     "Serra correzione previsione" confrontando ogni sera la massima vera
  #     con quella prevista al mattino.
  #     Senza previsione (internet giu'), la domanda si stima dalla sola notte:
  #     notti tiepide e umide d'autunno vogliono dire nuvole (R² = 0,51).
  #
  #  4. Dalla domanda alla durata, con le scelte fatte a mano da Eric come
  #     metro: 120 s a fine settembre (domanda media 28,5), 90 s a meta'
  #     ottobre (18,6), 50 s a novembre (10,1). Una retta le attraversa tutte:
  #         durata = 14,4 s + 3,78 s per kPa·h
  #     arrotondata alla decina e tenuta fra 20 e 300 s. Per spostarla (piu'
  #     acqua o meno acqua in generale) si cambiano i due numeri nel sensore
  #     qui sotto; tools/calibra_irrigazione.py la ricalcola da nuove scelte.

  # --- La notte appena passata ------------------------------------------------
  - triggers:
      - trigger: time
        at: "06:00:30"
    sensor:
      - name: "Serra notte temperatura"
        unique_id: serra_notte_temperatura
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:weather-night
        state: "{{ states('sensor.serra_temperatura_media_8_ore') | float(none) }}"
        attributes:
          giorno: "{{ now().date() | string }}"
          umidita: "{{ states('sensor.serra_umidita_media_8_ore') | float(none) }}"
          minima: "{{ states('sensor.serra_temperatura_minima_8_ore') | float(none) }}"
          # kPa: quanta acqua c'e' nell'aria, la misura che la scatola non falsa
          pressione_vapore: >-
            {% set t = states('sensor.serra_temperatura_media_8_ore') | float(none) %}
            {% set u = states('sensor.serra_umidita_media_8_ore') | float(none) %}
            {{ (0.6108 * e ** (17.27 * t / (t + 237.3)) * [u, 100] | min / 100) | round(3)
               if t is not none and u is not none else none }}
          punto_rugiada: >-
            {% set t = states('sensor.serra_temperatura_media_8_ore') | float(none) %}
            {% set u = states('sensor.serra_umidita_media_8_ore') | float(none) %}
            {% if t is not none and u is not none and u > 0 %}
              {% set a = log([u, 100] | min / 100) + 17.27 * t / (237.3 + t) %}
              {{ (237.3 * a / (17.27 - a)) | round(1) }}
            {% else %}{{ none }}{% endif %}

  # --- Previsione per la serra, da met.no -------------------------------------
  # Ogni ora chiede a met.no le previsioni orarie e ne ricava, per OGGI fino a
  # mezzogiorno e per DOMANI dopo, la massima esterna fra le 8 e le 18, la
  # nuvolosita' media, la pioggia, e la minima della prossima notte; poi le
  # traduce per la serra. Lo stato e' la massima prevista DENTRO la serra (nel
  # punto del sensore, scatola compresa: e' il numero che serve al calcolo).
  #
  # Attenzione all'altitudine: met.no corregge la temperatura sulla quota di
  # Home Assistant (Impostazioni -> Sistema -> Generale). Con 0 m, come era
  # fino al 10/11/2026, le temperature uscivano di 6,0 °C troppo alte: la
  # quota giusta per Baselga di Pine' e' 1000 m.
  - triggers:
      - trigger: time_pattern
        minutes: 12
      - trigger: homeassistant
        event: start
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: previsioni
        continue_on_error: true
    sensor:
      - name: "Serra previsione"
        unique_id: serra_previsione
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:weather-partly-cloudy
        availability: "{{ previsioni is defined and 'weather.forecast_home' in previsioni }}"
        state: >-
          {% set f = previsioni['weather.forecast_home'].forecast %}
          {% set g = (now() if now().hour < 12 else now() + timedelta(days=1)).date() %}
          {% set ns = namespace(tmax=none, nuv=0, n=0) %}
          {% for x in f %}
            {% set t = as_local(as_datetime(x.datetime)) %}
            {% if t.date() == g and 8 <= t.hour < 18 %}
              {% set ns.tmax = x.temperature if ns.tmax is none else [ns.tmax, x.temperature] | max %}
              {% set ns.nuv = ns.nuv + (x.cloud_coverage | default(50, true)) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {% set k = states('sensor.serra_correzione_previsione') | float(8.3) %}
          {% if ns.n > 0 %}
            {{ (ns.tmax + k + 19.2 * (1 - ns.nuv / ns.n / 100)) | round(1) }}
          {% else %}{{ none }}{% endif %}
        attributes:
          giorno: "{{ ((now() if now().hour < 12 else now() + timedelta(days=1)).date()) | string }}"
          tmax_fuori: >-
            {% set f = previsioni['weather.forecast_home'].forecast %}
            {% set g = (now() if now().hour < 12 else now() + timedelta(days=1)).date() %}
            {% set ns = namespace(tmax=none) %}
            {% for x in f %}
              {% set t = as_local(as_datetime(x.datetime)) %}
              {% if t.date() == g and 8 <= t.hour < 18 %}
                {% set ns.tmax = x.temperature if ns.tmax is none else [ns.tmax, x.temperature] | max %}
              {% endif %}
            {% endfor %}
            {{ ns.tmax }}
          sole: >-
            {% set f = previsioni['weather.forecast_home'].forecast %}
            {% set g = (now() if now().hour < 12 else now() + timedelta(days=1)).date() %}
            {% set ns = namespace(nuv=0, n=0) %}
            {% for x in f %}
              {% set t = as_local(as_datetime(x.datetime)) %}
              {% if t.date() == g and 8 <= t.hour < 18 %}
                {% set ns.nuv = ns.nuv + (x.cloud_coverage | default(50, true)) %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {{ (1 - ns.nuv / ns.n / 100) | round(2) if ns.n > 0 else none }}
          pioggia_mm: >-
            {% set f = previsioni['weather.forecast_home'].forecast %}
            {% set g = (now() if now().hour < 12 else now() + timedelta(days=1)).date() %}
            {% set ns = namespace(mm=0) %}
            {% for x in f %}
              {% set t = as_local(as_datetime(x.datetime)) %}
              {% if t.date() == g and 8 <= t.hour < 18 %}
                {% set ns.mm = ns.mm + (x.precipitation | default(0, true)) %}
              {% endif %}
            {% endfor %}
            {{ ns.mm | round(1) }}
          # La prossima notte, dalle 20 alle 8 (o quella in corso, prima delle 8).
          # In serra di notte si sta circa 1 °C sopra l'esterno (misurato
          # sulle notti di fine ottobre e novembre).
          tmin_serra_notte: >-
            {% set f = previsioni['weather.forecast_home'].forecast %}
            {% set inizio = today_at('20:00') - (timedelta(days=1) if now().hour < 8 else timedelta(0)) %}
            {% set ns = namespace(tmin=none) %}
            {% for x in f %}
              {% set t = as_local(as_datetime(x.datetime)) %}
              {% if inizio <= t < inizio + timedelta(hours=12) and t >= now() - timedelta(hours=1) %}
                {% set ns.tmin = x.temperature if ns.tmin is none else [ns.tmin, x.temperature] | min %}
              {% endif %}
            {% endfor %}
            {{ (ns.tmin + 1.0) | round(1) if ns.tmin is not none else none }}

  # --- La correzione della previsione, imparata giorno per giorno ------------
  # Alle 7 si annota la massima prevista per oggi, alle 21 la si confronta
  # con quella vera e si sposta la correzione di un quarto dell'errore: in
  # una settimana si adatta a un cambio di stagione, a una scatola spostata
  # o a una quota sbagliata, senza farsi trascinare da una giornata strana.
  - triggers:
      - trigger: time
        at: "07:00:00"
        id: mattina
      - trigger: time
        at: "21:00:00"
        id: sera
    sensor:
      - name: "Serra correzione previsione"
        unique_id: serra_correzione_previsione
        unit_of_measurement: "°C"
        icon: mdi:tune-variant
        state: >-
          {% set k = this.state | float(8.3) %}
          {% set vera = states('sensor.serra_temperatura_massima_oggi') | float(none) %}
          {% set prevista = this.attributes.get('prevista') %}
          {% if trigger.id == 'sera' and this.attributes.get('giorno') == now().date() | string
                and prevista is number and vera is not none and vera < 80 %}
            {% set k = k + 0.25 * (vera - prevista) %}
          {% endif %}
          {{ ([[k, -5] | max, 25] | min) | round(2) }}
        attributes:
          giorno: >-
            {{ now().date() | string if trigger.id == 'mattina' else 'appreso' }}
          prevista: >-
            {% set p = states('sensor.serra_previsione') | float(none) %}
            {{ p if trigger.id == 'mattina' and state_attr('sensor.serra_previsione', 'giorno') == now().date() | string
               else this.attributes.get('prevista') }}
          ultimo_errore: >-
            {% set vera = states('sensor.serra_temperatura_massima_oggi') | float(none) %}
            {% set prevista = this.attributes.get('prevista') %}
            {{ (vera - prevista) | round(1) if trigger.id == 'sera' and prevista is number and vera is not none
               else this.attributes.get('ultimo_errore') }}

  - sensor:
      # --- Previsione barometrica (Zambretti), senza internet ------------------
      # Il metodo dei barometri Negretti & Zambra: pressione ridotta al livello
      # del mare, tendenza delle ultime 3 ore e stagione danno una di 26 frasi.
      # Non sa niente di nuvole o vento, ma vede arrivare una perturbazione con
      # qualche ora di anticipo e non ha bisogno di nessuno.
      #
      # Quota di riduzione 898 m e non 1000: confrontata per 10 giorni con la
      # pressione al livello del mare di met.no, il BME280 si comporta come se
      # fosse a 898 m (scarto di 7 m). Puo' essere la quota vera della serra o
      # un errore di taratura del sensore di circa 11 hPa; per la previsione
      # conta solo che i due numeri tornino.
      - name: "Serra previsione barometrica"
        unique_id: serra_previsione_barometrica
        icon: mdi:weather-cloudy-clock
        availability: "{{ states('sensor.serra_pressione') | is_number }}"
        state: >-
          {% set p = states('sensor.serra_pressione') | float %}
          {% set dp = states('sensor.serra_pressione_variazione_3_ore') | float(0) %}
          {% set t = state_attr('weather.forecast_home', 'temperature') | float(8) %}
          {% set p0 = p * (1 - 0.0065 * 898 / (t + 0.0065 * 898 + 273.15)) ** -5.257 %}
          {% set estate = 4 <= now().month <= 9 %}
          {% set trend = 'su' if dp > 1.6 else ('giu' if dp < -1.6 else 'stabile') %}
          {% set pz = p0 + (7 if trend == 'su' and estate else 0) - (7 if trend == 'giu' and not estate else 0) %}
          {% set i = ([[((pz - 950) / (100 / 22)) | int, 0] | max, 21] | min) %}
          {% set tabella = {
               'su':      [25,25,25,24,24,19,16,12,11,9,8,6,5,2,1,1,0,0,0,0,0,0],
               'stabile': [25,25,25,25,25,25,23,23,22,18,15,13,10,4,1,1,0,0,0,0,0,0],
               'giu':     [25,25,25,25,25,25,25,25,23,23,21,20,17,14,7,3,1,1,1,0,0,0]} %}
          {% set frasi = ["Bel tempo stabile", "Bel tempo", "In miglioramento, poi bello",
               "Bello, tende a guastarsi", "Bello, possibili rovesci", "Discreto, in miglioramento",
               "Discreto, rovesci al mattino", "Discreto, rovesci piu' tardi",
               "Rovesci al mattino, poi migliora", "Variabile, in miglioramento",
               "Discreto, probabili rovesci", "Piuttosto instabile, schiarite piu' tardi",
               "Instabile, probabile miglioramento", "Rovesci con schiarite",
               "Rovesci, sempre piu' instabile", "Variabile, qualche pioggia",
               "Instabile, brevi schiarite", "Instabile, pioggia piu' tardi",
               "Instabile, qualche pioggia", "Molto instabile", "Piogge, in peggioramento",
               "Pioggia a tratti, molto instabile", "Pioggia frequente", "Pioggia, molto instabile",
               "Tempesta, possibile miglioramento", "Tempesta, molta pioggia"] %}
          {{ frasi[tabella[trend][i]] }}
        attributes:
          pressione_livello_mare: >-
            {% set p = states('sensor.serra_pressione') | float(0) %}
            {% set t = state_attr('weather.forecast_home', 'temperature') | float(8) %}
            {{ (p * (1 - 0.0065 * 898 / (t + 0.0065 * 898 + 273.15)) ** -5.257) | round(1) }}
          tendenza: >-
            {% set dp = states('sensor.serra_pressione_variazione_3_ore') | float(0) %}
            {{ 'in aumento' if dp > 1.6 else ('in calo' if dp < -1.6 else 'stabile') }}
          variazione_3_ore: "{{ states('sensor.serra_pressione_variazione_3_ore') | float(0) }}"

      # --- La durata consigliata per oggi --------------------------------------
      # Sempre calcolata e visibile, anche con la durata automatica spenta:
      # si puo' guardare per qualche giorno cosa farebbe prima di accenderla.
      - name: "Serra durata irrigazione consigliata"
        unique_id: serra_durata_irrigazione_consigliata
        unit_of_measurement: "s"
        icon: mdi:timer-sand-complete
        availability: >-
          {{ states('sensor.serra_notte_temperatura') | is_number
             and state_attr('sensor.serra_notte_temperatura', 'pressione_vapore') is number }}
        state: >-
          {% set tn = states('sensor.serra_notte_temperatura') | float %}
          {% set un = state_attr('sensor.serra_notte_temperatura', 'umidita') | float(80) %}
          {% set en = state_attr('sensor.serra_notte_temperatura', 'pressione_vapore') | float %}
          {% set tmin = state_attr('sensor.serra_notte_temperatura', 'minima') | float(tn) %}
          {% set tmax = states('sensor.serra_previsione') | float(none) %}
          {% if tmax is not none and tmax > tmin %}
            {% set ns = namespace(d=0) %}
            {% for h in range(8, 18) %}
              {% set f = [cos(pi * (h + 0.5 - 13) / 6), 0] | max %}
              {% set th = tmin + (tmax - tmin) * f %}
              {% set ns.d = ns.d + [0.6108 * e ** (17.27 * th / (th + 237.3)) - 1.2 * en, 0] | max %}
            {% endfor %}
            {% set d = 1.1 * ns.d %}
          {% else %}
            {% set d = [[102.4 - 0.619 * tn - 1.04 * un, 0] | max, 45] | min %}
          {% endif %}
          {% set durata = ((14.4 + 3.78 * d) / 10) | round(0) * 10 %}
          {{ ([[durata, 20] | max, 300] | min) | int }}
        attributes:
          domanda_kpa_h: >-
            {% set tn = states('sensor.serra_notte_temperatura') | float(0) %}
            {% set un = state_attr('sensor.serra_notte_temperatura', 'umidita') | float(80) %}
            {% set en = state_attr('sensor.serra_notte_temperatura', 'pressione_vapore') | float(0) %}
            {% set tmin = state_attr('sensor.serra_notte_temperatura', 'minima') | float(tn) %}
            {% set tmax = states('sensor.serra_previsione') | float(none) %}
            {% if tmax is not none and tmax > tmin %}
              {% set ns = namespace(d=0) %}
              {% for h in range(8, 18) %}
                {% set f = [cos(pi * (h + 0.5 - 13) / 6), 0] | max %}
                {% set th = tmin + (tmax - tmin) * f %}
                {% set ns.d = ns.d + [0.6108 * e ** (17.27 * th / (th + 237.3)) - 1.2 * en, 0] | max %}
              {% endfor %}
              {{ (1.1 * ns.d) | round(1) }}
            {% else %}
              {{ ([[102.4 - 0.619 * tn - 1.04 * un, 0] | max, 45] | min) | round(1) }}
            {% endif %}
          fonte: >-
            {% set tmax = states('sensor.serra_previsione') | float(none) %}
            {{ 'notte + previsione met.no' if tmax is not none else 'solo notte (previsione non disponibile)' }}
          notte_del: "{{ state_attr('sensor.serra_notte_temperatura', 'giorno') }}"

# ---------------------------------------------------------------------------
#  Automazioni
# ---------------------------------------------------------------------------
#  Le notifiche usano persistent_notification, che c'e' sempre. Per riceverle
#  sul telefono sostituisci l'azione con:
#      action: notify.mobile_app_<nome_del_tuo_telefono>
#      data: { title: "...", message: "..." }

automation:
  # --- Batteria scarica ------------------------------------------------------
  - id: serra_batteria_scarica
    alias: "Serra - Batteria scarica"
    description: "Avvisa quando la tensione della batteria scende sotto 11,2 V"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.serra_tensione_batteria
        below: 11.2
        for: "00:30:00"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: batteria scarica"
          message: >-
            La batteria della serra e' a {{ states('sensor.serra_tensione_batteria') }} V.
            Sotto gli 11 V il nodo potrebbe non riuscire piu' a trasmettere.
          notification_id: serra_batteria

  # --- Nodo muto -------------------------------------------------------------
  - id: serra_nodo_muto
    alias: "Serra - Nessun dato dal nodo"
    description: "Avvisa se non arrivano pacchetti da oltre 2 ore"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.serra_minuti_dall_ultimo_contatto
        above: 120
    conditions:
      - condition: state
        entity_id: binary_sensor.serra_ponte_online
        state: "on"    # se e' giu' il ponte il problema e' un altro
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: nodo silenzioso"
          # Se a non ascoltare e' la radio del ponte, mandare a controllare
          # nodo e antenna e' una falsa pista: l'11/11/2026 e' andata cosi'.
          message: >-
            Nessun dato dalla serra da {{ states('sensor.serra_minuti_dall_ultimo_contatto') }} minuti.
            {% if is_state('binary_sensor.serra_radio_del_ponte', 'on')
                  and not state_attr('binary_sensor.serra_radio_del_ponte', 'in_ascolto') %}
            Il guasto e' sul ponte, non nella serra: la sua radio LoRa non ascolta
            ({{ state_attr('binary_sensor.serra_radio_del_ponte', 'motivo') }}).
            {% else %}
            Controlla alimentazione del nodo, antenna LoRa e batteria.
            {% endif %}
          notification_id: serra_muto

  # --- Radio del ponte guasta ------------------------------------------------
  # Il ponte e' acceso e parla con MQTT, ma il suo modulo LoRa no. Cinque
  # minuti di attesa: una riparazione riuscita dura meno di un secondo e non
  # deve far scattare niente. Quando la radio riparte l'avviso si toglie da solo.
  - id: serra_radio_ponte_guasta
    alias: "Serra - Radio del ponte guasta"
    description: "Il ponte e' acceso ma il suo modulo LoRa non ascolta"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.serra_radio_del_ponte
        to: "on"
        for: "00:05:00"
        id: guasta
      - trigger: state
        entity_id: binary_sensor.serra_radio_del_ponte
        from: "on"
        to: "off"
        for: "00:02:00"
        id: riparte
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: guasta
            sequence:
              - action: persistent_notification.create
                data:
                  title: "Serra: la radio del ponte non funziona"
                  message: >-
                    {% set motivo = state_attr('binary_sensor.serra_radio_del_ponte', 'motivo') %}
                    {% if state_attr('binary_sensor.serra_radio_del_ponte', 'in_ascolto') %}
                    La radio LoRa del ponte ascolta, ma a reset appena fatto un
                    registro di configurazione non torna: {{ motivo }}.
                    Se i dati della serra arrivano non e' urgente: e' un
                    indizio di fili disturbati fra ESP32 e modulo LoRa.
                    {% else %}
                    Il ponte e' acceso e collegato, ma il suo modulo LoRa non
                    sta ascoltando: {{ motivo }}.
                    Finche' resta cosi' dalla serra non arriva niente. Il nodo
                    intanto irriga da solo e tiene da parte gli ultimi dati
                    (circa 11 ore senza microSD).
                    Controlla i fili fra ESP32 e modulo LoRa del ponte, per
                    primi 3,3 V e massa, poi togli e ridai corrente al ponte.
                    {% endif %}
                  notification_id: serra_radio_ponte
        default:
          - action: persistent_notification.dismiss
            data:
              notification_id: serra_radio_ponte

  # --- Anomalia idraulica ----------------------------------------------------
  - id: serra_nessun_flusso
    alias: "Serra - Irrigazione senza flusso d'acqua"
    description: "La valvola si e' aperta ma il flussometro non ha contato nulla"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.serra_anomalia_irrigazione
        to: "on"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: irrigazione a vuoto"
          message: >-
            La valvola si e' aperta ma non e' passata acqua.
            Possibili cause: serbatoio vuoto, pompa guasta, filtro otturato,
            tubo staccato, oppure il flussometro si e' scollegato.
          notification_id: serra_flusso

  # --- Irrigazione quasi a secco ---------------------------------------------
  # Il caso che "nessun_flusso" non vede: il 4/11/2026 la valvola si e' aperta
  # per 50 s e sono passati 0,002 L, un impulso solo, con esito "ok". Il nodo
  # dal firmware 2.6.0 lo chiama nessun_flusso da solo (FLUSSO_MIN_IMPULSI);
  # questo avviso copre anche i nodi piu' vecchi e le portate dimezzate.
  - id: serra_irrigazione_scarsa
    alias: "Serra - Irrigazione quasi a secco"
    description: "L'irrigazione e' finita con molta meno acqua del previsto"
    mode: single
    triggers:
      # Anche da "non disponibile": il 4/11 il valore e' passato da 2,209 a
      # 0,002 attraverso una riconnessione del ponte, e un filtro sullo stato
      # di partenza l'avrebbe perso. Le ripubblicazioni dello stesso valore
      # dopo ogni riconnessione le ferma la pausa di 12 ore.
      - trigger: state
        entity_id: sensor.serra_acqua_ultima_irrigazione
        not_to: [unknown, unavailable]
    conditions:
      - condition: state
        entity_id: sensor.serra_esito_irrigazione
        state: "ok"
      # Sotto 0,1 L, o meno di un quarto della volta prima quando la si
      # conosce: un'irrigazione vera non ci arriva.
      - "{{ trigger.to_state.state | float(0) < 0.1
            or trigger.to_state.state | float(0) < 0.25 * trigger.from_state.state | float(0) }}"
      - "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 43200 }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: irrigazione quasi a secco"
          message: >-
            L'ultima irrigazione ha dato {{ trigger.to_state.state }} L in
            {{ states('number.serra_durata_irrigazione') }} s. La valvola si e' aperta ma
            l'acqua non e' arrivata: serbatoio vuoto, rubinetto chiuso, filtro
            otturato o tubo staccato.
          notification_id: serra_irrigazione_scarsa

  # --- Backlog che cresce ----------------------------------------------------
  - id: serra_backlog_alto
    alias: "Serra - Backlog in crescita"
    description: "Il nodo sta accumulando dati non consegnati"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.serra_record_in_backlog
        above: 50
        for: "01:00:00"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: dati in attesa"
          message: >-
            Ci sono {{ states('sensor.serra_record_in_backlog') }} record sulla
            microSD che non riescono ad arrivare. Il collegamento LoRa e' debole
            o il ponte ha problemi con MQTT.
          notification_id: serra_backlog

  # --- Comando eseguito ------------------------------------------------------
  # Conferma visibile: i comandi vengono eseguiti al risveglio successivo del
  # nodo, quindi senza un riscontro esplicito sembrerebbe che non sia successo nulla.
  - id: serra_comando_eseguito
    alias: "Serra - Esito comando"
    description: "Notifica quando il nodo ha eseguito un comando"
    mode: queued
    max: 10
    triggers:
      - trigger: mqtt
        topic: "serra/nodo/cmd/res"
    actions:
      - choose:
          - conditions: "{{ trigger.payload_json.ok }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "Serra: comando eseguito"
                  message: "Esito: {{ trigger.payload_json.esito }}"
                  notification_id: serra_cmd
        default:
          - action: persistent_notification.create
            data:
              title: "Serra: comando RIFIUTATO"
              message: >-
                Il nodo ha rifiutato il comando: {{ trigger.payload_json.esito }}
                (codice {{ trigger.payload_json.rc }}).
                Codici: 1 = opcode sconosciuto, 2 = argomenti errati,
                3 = bloccato da un limite di sicurezza, 4 = hardware assente.
              notification_id: serra_cmd

  # --- Gelo e caldo ----------------------------------------------------------
  # Ogni soglia compare due volte, nel trigger (che vuole un numero scritto,
  # non un template) e nella variabile "soglia" del messaggio: per cambiarla
  # vanno cambiati tutti e due. Al massimo un
  # avviso ogni 12 ore, perche' una temperatura che oscilla attorno alla
  # soglia lo farebbe ripartire a ogni pacchetto (e il package delle
  # notifiche Telegram inoltra ogni avviso al telefono).
  - id: serra_rischio_gelo
    alias: "Serra - Rischio gelo"
    description: "La temperatura in serra scende sotto la soglia di gelo"
    mode: single
    variables:
      soglia: 2.0          # °C
    triggers:
      - trigger: numeric_state
        entity_id: sensor.serra_temperatura
        below: 2.0         # la stessa soglia: qui serve un numero letterale
    conditions:
      - "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 43200 }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: rischio gelo"
          message: >-
            In serra ci sono {{ states('sensor.serra_temperatura') }} °C, sotto i
            {{ soglia }} °C (minima di oggi {{ states('sensor.serra_temperatura_minima_oggi') }} °C).
            Valuta un telo di copertura o un riscaldatore; l'acqua nei tubi
            dell'irrigazione puo' gelare.
          notification_id: serra_gelo

  - id: serra_troppo_caldo
    alias: "Serra - Troppo caldo"
    description: "La temperatura in serra supera la soglia di caldo"
    mode: single
    variables:
      soglia: 40.0         # °C
    triggers:
      - trigger: numeric_state
        entity_id: sensor.serra_temperatura
        above: 40.0
    conditions:
      - "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 43200 }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: troppo caldo"
          message: >-
            In serra ci sono {{ states('sensor.serra_temperatura') }} °C, oltre i
            {{ soglia }} °C, con umidita' al {{ states('sensor.serra_umidita_aria') }} %
            (VPD {{ states('sensor.serra_vpd') }} kPa). Apri o ombreggia la serra.
          notification_id: serra_caldo

  # --- Collegamento debole ---------------------------------------------------
  # Meno dell'85% dei cicli arrivati nelle ultime 24 ore, contando anche
  # quelli recuperati dopo dalle code del nodo. Al massimo un avviso al giorno.
  - id: serra_collegamento_debole
    alias: "Serra - Collegamento debole"
    description: "Troppi cicli del nodo non arrivano a Home Assistant"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.serra_cicli_ricevuti_24h
        below: 85
        for: "01:00:00"
    conditions:
      - "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 86400 }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: collegamento debole"
          message: >-
            Nelle ultime 24 ore e' arrivato il {{ states('sensor.serra_cicli_ricevuti_24h') }}%
            dei cicli del nodo. Segnale LoRa {{ states('sensor.serra_segnale_lora') }} dBm,
            SNR {{ states('sensor.serra_snr_lora') }} dB. Controlla antenne e
            connettori di nodo e ponte; con la microSD guasta i pacchetti
            persi aspettano solo nella riserva in RAM del nodo (firmware 2.6.0).
          notification_id: serra_collegamento

  # --- MicroSD guasta --------------------------------------------------------
  # bl = -1: il nodo non vede la scheda. Senza microSD resta solo la riserva
  # in RAM RTC (circa 11 ore, firmware 2.6.0), che una mancanza di corrente
  # cancella.
  - id: serra_microsd_guasta
    alias: "Serra - MicroSD guasta"
    description: "Il nodo non riesce piu' a usare la microSD"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.serra_record_in_backlog
        below: 0
        for: "03:00:00"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: microSD guasta"
          message: >-
            Da piu' di tre ore il nodo non vede la microSD. I pacchetti non
            consegnati aspettano nella riserva in RAM ({{ states('sensor.serra_pacchetti_in_riserva') }}
            in attesa), che si perde se manca la corrente. Controlla scheda e
            modulo: il modulo con level shifter vuole 5 V, non 3,3 V.
          notification_id: serra_microsd

  # --- Gelo previsto stanotte ------------------------------------------------
  # Un avviso PRIMA, non durante: alle 18:30, se la minima prevista in serra
  # per la notte (esterna di met.no + 1 °C) scende sotto 1 °C, c'e' ancora
  # luce per coprire le piante o svuotare i tubi.
  - id: serra_gelo_previsto
    alias: "Serra - Gelo previsto stanotte"
    description: "La previsione dice che stanotte in serra si va sotto 1 °C"
    mode: single
    triggers:
      - trigger: time
        at: "18:30:00"
    conditions:
      - "{{ state_attr('sensor.serra_previsione', 'tmin_serra_notte') is number }}"
      - "{{ state_attr('sensor.serra_previsione', 'tmin_serra_notte') < 1.0 }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Serra: gelo previsto stanotte"
          message: >-
            Stanotte in serra si prevedono circa
            {{ state_attr('sensor.serra_previsione', 'tmin_serra_notte') }} °C
            (minima esterna prevista + 1 °C). Copri le piante sensibili e, se
            l'impianto resta pieno d'acqua, valuta di svuotare i tubi.
          notification_id: serra_gelo_previsto


  # ===========================================================================
  #  DURATA AUTOMATICA (il pulsante) E DURATA NORMALE
  # ===========================================================================
  #  Cinque automazioni piccole invece di una grande, perche' ognuna risponde
  #  a una domanda sola:
  #
  #    acceso / 6:40         -> sul nodo la durata consigliata
  #    spento                -> sul nodo la durata normale
  #    durata cambiata a mano -> diventa la nuova durata normale
  #    durata normale cambiata a mano, col pulsante spento -> va sul nodo
  #    primo avvio           -> la durata normale si prende dal nodo
  #
  #  "A mano" vuol dire: una persona ha chiamato number.set_value (dashboard,
  #  dettaglio dell'entita', app). Lo si riconosce dal contesto, che porta
  #  l'utente; le automazioni non ce l'hanno. NON si guardano i cambi di stato
  #  di number.serra_durata_irrigazione: quelli li produce il nodo quando
  #  riferisce sDur, e a ogni riconnessione del ponte il valore ripassa da
  #  "non disponibile" -- una durata automatica appena impostata finirebbe
  #  scambiata per una scelta a mano.

  - id: serra_irrigazione_adattiva
    alias: "Serra - Durata automatica"
    description: "Col pulsante acceso porta sul nodo la durata consigliata: subito e ogni mattina alle 6:40"
    mode: single
    triggers:
      - trigger: time
        at: "06:40:00"
      - trigger: state
        entity_id: input_boolean.serra_irrigazione_adattiva
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.serra_irrigazione_adattiva
        state: "on"
    actions:
      # La durata normale va messa al sicuro prima di sovrascriverla. Di solito
      # c'e' gia', ma al primissimo uso no.
      - if: >-
          {{ states('input_number.serra_durata_base_irrigazione') | int(10) <= 10
             and states('number.serra_durata_irrigazione') | is_number }}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.serra_durata_base_irrigazione
            data:
              value: "{{ [[states('number.serra_durata_irrigazione') | int, 10] | max, 600] | min }}"
      # Acceso di notte, prima della fotografia delle 6:00: si dice perche'
      # non succede niente, invece di lasciar credere che non funzioni.
      - if: "{{ not states('sensor.serra_durata_irrigazione_consigliata') | is_number }}"
        then:
          - if: "{{ trigger.platform == 'state' }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "Serra: durata automatica accesa"
                  message: >-
                    La durata consigliata non e' ancora pronta: serve la notte appena
                    passata, che si misura dalle 22 alle 6. Fino ad allora il nodo resta a
                    {{ states('number.serra_durata_irrigazione') }} s; la durata
                    automatica parte domattina alle 6:40.
                  notification_id: serra_adattiva
          - stop: "Durata consigliata non ancora disponibile"
      # Il ponte puo' essere giu': si aspetta che il nodo torni raggiungibile,
      # fino a un'ora, invece di perdere il comando in silenzio.
      - wait_template: "{{ states('number.serra_durata_irrigazione') | is_number }}"
        timeout: "01:00:00"
        continue_on_timeout: false
      - variables:
          durata: "{{ states('sensor.serra_durata_irrigazione_consigliata') | int }}"
          attuale: "{{ states('number.serra_durata_irrigazione') | int(0) }}"
          domanda: "{{ state_attr('sensor.serra_durata_irrigazione_consigliata', 'domanda_kpa_h') }}"
          fonte: "{{ state_attr('sensor.serra_durata_irrigazione_consigliata', 'fonte') }}"
      - if: "{{ (durata - attuale) | abs >= 10 }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.serra_durata_irrigazione
            data:
              value: "{{ durata }}"
          - action: persistent_notification.create
            data:
              title: "Serra: durata automatica"
              message: >-
                Notte a {{ states('sensor.serra_notte_temperatura') }} °C e
                {{ state_attr('sensor.serra_notte_temperatura', 'umidita') }} %, massima prevista
                in serra {{ states('sensor.serra_previsione') }} °C: domanda di {{ domanda }} kPa·h
                ({{ fonte }}). L'irrigazione passa da {{ attuale }} a {{ durata }} s.
              notification_id: serra_adattiva
        else:
          - if: "{{ trigger.platform == 'state' }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "Serra: durata automatica accesa"
                  message: >-
                    Il nodo e' gia' alla durata consigliata per oggi, {{ attuale }} s
                    (domanda di {{ domanda }} kPa·h). Da domani la sceglie ogni mattina alle 6:40.
                  notification_id: serra_adattiva

  - id: serra_durata_automatica_spenta
    alias: "Serra - Durata automatica spenta"
    description: "Col pulsante spento torna sul nodo la durata normale"
    mode: restart          # riaccendere e rispegnere non lascia attese vecchie
    triggers:
      - trigger: state
        entity_id: input_boolean.serra_irrigazione_adattiva
        from: "on"
        to: "off"
    conditions:
      - "{{ states('input_number.serra_durata_base_irrigazione') | int(10) > 10 }}"
    actions:
      - variables:
          normale: "{{ states('input_number.serra_durata_base_irrigazione') | int }}"
      - wait_template: "{{ states('number.serra_durata_irrigazione') | is_number }}"
        timeout: "06:00:00"
        continue_on_timeout: false
      - if: "{{ states('number.serra_durata_irrigazione') | int(0) != normale }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.serra_durata_irrigazione
            data:
              value: "{{ normale }}"
      - action: persistent_notification.create
        data:
          title: "Serra: durata automatica spenta"
          message: >-
            Torna la durata normale: {{ normale }} s. Il nodo la applica al prossimo
            risveglio, entro 15 minuti.
          notification_id: serra_adattiva

  - id: serra_durata_normale_ricorda
    alias: "Serra - Ricorda la durata normale"
    description: "Una durata impostata a mano diventa la durata normale"
    mode: queued
    max: 5
    triggers:
      - trigger: event
        event_type: call_service
        event_data:
          domain: number
          service: set_value
    conditions:
      - "{{ trigger.event.context.user_id is not none }}"
      - >-
        {% set e = trigger.event.data.service_data.entity_id | default([]) %}
        {{ 'number.serra_durata_irrigazione' in ([e] if e is string else e) }}
      - "{{ trigger.event.data.service_data.value is defined }}"
    actions:
      - variables:
          valore: "{{ [[trigger.event.data.service_data.value | float(0) | round(0) | int, 10] | max, 600] | min }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_durata_base_irrigazione
        data:
          value: "{{ valore }}"
      # Col pulsante acceso la scelta a mano vale per oggi, poi alle 6:40 torna
      # la durata automatica: meglio dirlo.
      - if: "{{ is_state('input_boolean.serra_irrigazione_adattiva', 'on') }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Serra: durata impostata a mano"
              message: >-
                {{ valore }} s da adesso, ed e' la nuova durata normale. La durata
                automatica e' accesa: domattina alle 6:40 torna a decidere lei. Per
                tenere {{ valore }} s anche nei prossimi giorni, spegni "Durata automatica".
              notification_id: serra_adattiva

  - id: serra_durata_normale_applica
    alias: "Serra - Applica la durata normale"
    description: "Col pulsante spento, la durata normale cambiata a mano va subito sul nodo"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_number.serra_durata_base_irrigazione
    conditions:
      - "{{ trigger.to_state.context.user_id is not none }}"
      - condition: state
        entity_id: input_boolean.serra_irrigazione_adattiva
        state: "off"
      - "{{ states('number.serra_durata_irrigazione') | is_number }}"
      - "{{ states('number.serra_durata_irrigazione') | int != trigger.to_state.state | int(0) }}"
    actions:
      - action: number.set_value
        target:
          entity_id: number.serra_durata_irrigazione
        data:
          value: "{{ trigger.to_state.state | int }}"

  - id: serra_durata_normale_iniziale
    alias: "Serra - Durata normale iniziale"
    description: "Finche' la durata normale non e' mai stata scelta, la si prende dal nodo"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
      - trigger: state
        entity_id: number.serra_durata_irrigazione
    conditions:
      - "{{ states('input_number.serra_durata_base_irrigazione') | int(10) <= 10 }}"
      - "{{ states('number.serra_durata_irrigazione') | is_number }}"
      - condition: state
        entity_id: input_boolean.serra_irrigazione_adattiva
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_durata_base_irrigazione
        data:
          value: "{{ [[states('number.serra_durata_irrigazione') | int, 10] | max, 600] | min }}"

# ---------------------------------------------------------------------------
#  DATI RECUPERATI NEI GRAFICI
# ---------------------------------------------------------------------------
#  I record che il nodo rimanda dopo un buio (serra/nodo/storico) vengono
#  registrati all'ora in cui sono stati misurati, cosi' nei grafici il buco
#  si chiude: temperatura, umidita', pressione, batteria, luce e VPD, con le
#  statistiche orarie. Lo fa il componente custom_components/serra_storico,
#  che va copiato in /config/custom_components (poi riavvio). Senza il
#  componente questa riga fa fallire la verifica della configurazione:
#  toglierla se non lo si installa.
#  sensor.serra_ultimo_recupero_nei_grafici dice quanti valori ha scritto
#  l'ultima volta, e per che periodo.
serra_storico:
