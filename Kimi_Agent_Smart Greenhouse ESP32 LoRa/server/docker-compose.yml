# ============================================================================
#  SERRA SMART — Broker MQTT (Mosquitto) per il server in garage
#  Da installare su CasaOS come "Custom Install" (docker-compose)
#  oppure manualmente con:  docker compose up -d
# ============================================================================

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"          # MQTT (solo rete locale / Tailscale)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
